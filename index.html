<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Beautrì Srl</title>
    <link rel="icon" type="image/png" href="https://beautri.it/wp-content/uploads/2020/02/cropped-favicon_beautri-270x270.png">
    <link rel="apple-touch-icon" href="https://beautri.it/wp-content/uploads/2020/02/cropped-favicon_beautri-270x270.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800&display=swap" rel="stylesheet">
 
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
 
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #E8E4DA;
        font-family: 'Outfit', sans-serif;
        touch-action: none; /* gestiamo noi il touch */
      }
 
      /* ══ CAROUSEL ══ */
      #carousel-view {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
 
      .carousel-track {
        display: flex;
        align-items: center;
        width: 100%;
        height: 100%;
        overflow-x: scroll;
        overflow-y: hidden;
        scroll-snap-type: x mandatory;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
        touch-action: pan-x; /* solo swipe orizzontale */
      }
      .carousel-track::-webkit-scrollbar { display: none; }
 
      .slide {
        flex: 0 0 100vw;
        width: 100vw;
        height: 100%;
        scroll-snap-align: center;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        /* niente onclick qui — gestiamo via JS con distinzione tap/swipe */
      }
 
      .slide img {
        width: 88vw;
        max-width: 420px;
        max-height: 88vh;
        object-fit: contain;
        user-select: none;
        pointer-events: none;
        transition: transform 0.15s ease;
        filter: drop-shadow(0 30px 60px rgba(0,0,0,0.22));
        -webkit-user-drag: none;
      }
 
      .slide.tapped img { transform: scale(0.96); }
 
      /* ── Dots ── */
      .dots {
        position: fixed;
        bottom: 1.8rem;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 7px;
        z-index: 10;
        pointer-events: none;
      }
 
      .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: rgba(26,26,26,0.2);
        transition: background 0.3s, transform 0.3s;
      }
 
      .dot.active {
        background: #1A1A1A;
        transform: scale(1.35);
      }
 
      /* ── Swipe hint — FISSO, non sparisce ── */
      .swipe-hint {
        position: fixed;
        bottom: 3.8rem;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 0.4rem;
        font-size: 0.58rem;
        font-weight: 600;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: rgba(26,26,26,0.3);
        z-index: 10;
        pointer-events: none;
        white-space: nowrap;
      }
 
      .swipe-hint svg {
        width: 14px;
        height: 14px;
        animation: arrow-bounce 1.6s ease-in-out infinite;
      }
 
      @keyframes arrow-bounce {
        0%, 100% { transform: translateX(0); opacity: 0.4; }
        50%       { transform: translateX(5px); opacity: 1; }
      }
 
      /* ── Play Badge su ogni slide ── */
      .play-badge {
        position: absolute;
        bottom: 10%;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 0.5rem;
        background: rgba(26,26,26,0.82);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 50px;
        padding: 0.5rem 1.1rem 0.5rem 0.75rem;
        cursor: pointer;
        pointer-events: none; /* il click lo gestisce il JS della slide */
        white-space: nowrap;
        animation: badge-pulse 2.8s ease-in-out infinite;
      }
 
      @keyframes badge-pulse {
        0%, 100% { box-shadow: 0 0 0 0 rgba(234,179,10,0); }
        50%       { box-shadow: 0 0 0 6px rgba(234,179,10,0.2); }
      }
 
      .play-badge .play-icon {
        width: 28px;
        height: 28px;
        background: #EAB30A;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        animation: icon-ping 2.8s ease-in-out infinite;
      }
 
      @keyframes icon-ping {
        0%, 100% { transform: scale(1); }
        50%       { transform: scale(1.1); }
      }
 
      .play-badge .play-icon svg {
        width: 11px;
        height: 11px;
        fill: #1A1A1A;
        margin-left: 2px;
      }
 
      .play-badge .play-label {
        font-family: 'Outfit', sans-serif;
        font-size: 0.68rem;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: #FFFFFF;
      }
 
      /* ── Swipe Gesture Overlay (primo avvio) ── */
      #swipe-overlay {
        position: fixed;
        inset: 0;
        z-index: 100;
        pointer-events: none;
        display: flex;
        align-items: center;
        justify-content: center;
      }
 
      .swipe-gesture {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.6rem;
        opacity: 0;
        animation: gesture-show 0.6s ease 0.8s forwards,
                   gesture-hide 0.5s ease 3.5s forwards;
      }
 
      @keyframes gesture-show { to { opacity: 1; } }
      @keyframes gesture-hide { to { opacity: 0; } }
 
      .gesture-hand {
        font-size: 2.2rem;
        animation: hand-swipe 1.2s ease-in-out 1.4s 2 forwards;
      }
 
      @keyframes hand-swipe {
        0%   { transform: translateX(0); }
        40%  { transform: translateX(-28px); }
        70%  { transform: translateX(28px); }
        100% { transform: translateX(0); }
      }
 
      .gesture-label {
        font-family: 'Outfit', sans-serif;
        font-size: 0.62rem;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: rgba(26,26,26,0.45);
        background: rgba(232,228,218,0.85);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-radius: 20px;
        padding: 0.3rem 0.9rem;
      }
 
      /* ── Tap Hint (appare dopo qualche secondo) ── */
      #tap-hint {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, calc(-50% + 52vw));
        z-index: 90;
        pointer-events: none;
        opacity: 0;
        animation: tap-hint-in  0.5s ease 4.2s forwards,
                   tap-hint-out 0.5s ease 7.5s forwards;
      }
 
      @keyframes tap-hint-in  { to { opacity: 1; } }
      @keyframes tap-hint-out { to { opacity: 0; } }
 
      .tap-hint-inner {
        display: flex;
        align-items: center;
        gap: 0.45rem;
        background: rgba(234,179,10,0.92);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border-radius: 50px;
        padding: 0.45rem 1rem 0.45rem 0.7rem;
      }
 
      .tap-icon {
        font-size: 1rem;
        animation: tap-anim 1s ease-in-out 4.7s 3;
      }
 
      @keyframes tap-anim {
        0%, 100% { transform: scale(1); }
        40%       { transform: scale(0.8); }
      }
 
      .tap-hint-inner span {
        font-family: 'Outfit', sans-serif;
        font-size: 0.65rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #1A1A1A;
        white-space: nowrap;
      }
 
      /* ══ VIDEO ══ */
      #video-view {
        display: none;
        position: fixed;
        inset: 0;
        background: #E8E4DA;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 3.5rem 1rem 1rem;
        z-index: 200;
      }
 
      #video-view.active { display: flex; }
 
      .back-btn {
        position: absolute;
        top: 1.1rem;
        left: 1.2rem;
        display: flex;
        align-items: center;
        gap: 0.4rem;
        font-size: 0.65rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #1A1A1A;
        opacity: 0.45;
        background: none;
        border: none;
        cursor: pointer;
        padding: 0.5rem 0; /* area touch più grande */
        font-family: 'Outfit', sans-serif;
        transition: opacity 0.2s;
        -webkit-tap-highlight-color: transparent;
      }
      .back-btn:hover, .back-btn:active { opacity: 1; }
      .back-btn svg { width: 14px; height: 14px; }
 
      .video-wrapper {
        width: 100%;
        height: calc(100vh - 5rem);
        max-width: calc((100vh - 5rem) * 9 / 16);
        border-radius: 18px;
        overflow: hidden;
        box-shadow: 0 16px 48px rgba(26,26,26,0.2);
        background: #1A1A1A;
      }
 
      .video-wrapper iframe {
        width: 100%;
        height: 100%;
        border: none;
        display: block;
      }
 
      /* ══ WHATSAPP ══ */
      .wa-float {
        position: fixed;
        bottom: 1.4rem;
        right: 1.2rem;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: flex-end;
      }
 
      .wa-pill {
        display: flex;
        align-items: center;
        background: #1A1A1A;
        border-radius: 50px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        text-decoration: none;
        overflow: hidden;
        opacity: 0;
        transform: scale(0.7) translateY(10px);
        animation: wa-appear 0.5s cubic-bezier(0.34,1.4,0.64,1) 5s forwards;
      }
 
      @keyframes wa-appear {
        to { opacity: 1; transform: scale(1) translateY(0); }
      }
 
      .wa-text {
        font-family: 'Outfit', sans-serif;
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        color: #FFFFFF;
        white-space: nowrap;
        padding: 0 1.1rem 0 1.3rem;
        max-width: 220px;
        overflow: hidden;
        opacity: 0;
        animation:
          text-in  0.4s ease 5.5s forwards,
          text-out 0.4s ease 9s   forwards;
      }
 
      @keyframes text-in  { to { opacity: 1; } }
      @keyframes text-out { to { opacity: 0; max-width: 0; padding: 0; } }
 
      .wa-icon {
        width: 58px;
        height: 58px;
        border-radius: 50%;
        background: #25D366;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        transition: transform 0.2s cubic-bezier(0.34,1.56,0.64,1);
        animation: wa-pulse 3s ease-in-out 6s infinite;
      }
 
      @keyframes wa-pulse {
        0%, 100% { box-shadow: 0 0 0 0 rgba(37,211,102,0); }
        50%       { box-shadow: 0 0 0 8px rgba(37,211,102,0.25); }
      }
 
      .wa-pill:active .wa-icon { transform: scale(0.93); }
      .wa-icon svg { width: 32px; height: 32px; fill: #FFFFFF; }
    </style>
  </head>

    <script>
      const track   = document.getElementById('track');
      const dots    = document.querySelectorAll('.dot');
      const slides  = document.querySelectorAll('.slide');
      const swipeOverlay = document.getElementById('swipe-overlay');
      const tapHint      = document.getElementById('tap-hint');
 
      let hasSwipedOnce = false;
 
      /* ── Aggiorna dots sullo scroll ── */
      track.addEventListener('scroll', () => {
        const idx = Math.round(track.scrollLeft / window.innerWidth);
        dots.forEach((d, i) => d.classList.toggle('active', i === idx));
 
        /* Nascondi swipe overlay al primo scroll reale */
        if (!hasSwipedOnce && track.scrollLeft > 10) {
          hasSwipedOnce = true;
          swipeOverlay.style.transition = 'opacity 0.4s ease';
          swipeOverlay.style.opacity = '0';
          tapHint.style.animationPlayState = 'running';
          setTimeout(() => swipeOverlay.style.display = 'none', 400);
        }
      }, { passive: true });
 
      /* ── Distinzione TAP vs SWIPE ──
         Registriamo la posizione touchstart.
         Se lo spostamento X è < 10px = tap → apriamo video.
         Se è >= 10px = swipe → ignoriamo. */
      let touchStartX = 0;
      let touchStartY = 0;
      let isSwiping   = false;
 
      track.addEventListener('touchstart', (e) => {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
        isSwiping = false;
      }, { passive: true });
 
      track.addEventListener('touchmove', (e) => {
        const dx = Math.abs(e.touches[0].clientX - touchStartX);
        const dy = Math.abs(e.touches[0].clientY - touchStartY);
        if (dx > 8 || dy > 8) isSwiping = true;
      }, { passive: true });
 
      track.addEventListener('touchend', (e) => {
        if (isSwiping) return; /* era uno swipe, ignora */
 
        /* Trova la slide corrente */
        const idx = Math.round(track.scrollLeft / window.innerWidth);
        const slide = slides[idx];
        if (!slide) return;
 
        /* Feedback visivo */
        slide.classList.add('tapped');
        setTimeout(() => slide.classList.remove('tapped'), 150);
 
        /* Apri video dopo breve delay per il feedback */
        setTimeout(() => openVideo(slide.dataset.video), 120);
      }, { passive: true });
 
      /* ── Supporto click desktop ── */
      slides.forEach(slide => {
        slide.addEventListener('click', () => {
          openVideo(slide.dataset.video);
        });
      });
 
      /* ── Video ── */
      function openVideo(ytid) {
        if (!ytid) return;
        /* Nascondi tap hint al primo tap */
        tapHint.style.transition = 'opacity 0.3s ease';
        tapHint.style.opacity = '0';
        const iframe = document.getElementById('video-iframe');
        iframe.src = 'https://www.youtube.com/embed/' + ytid +
          '?autoplay=1&rel=0&modestbranding=1&playsinline=1';
        document.getElementById('video-view').classList.add('active');
      }
 
      document.getElementById('back-btn').addEventListener('click', closeVideo);
      document.getElementById('back-btn').addEventListener('touchend', function(e) {
        e.preventDefault();
        closeVideo();
      });
 
      function closeVideo() {
        document.getElementById('video-iframe').src = '';
        document.getElementById('video-view').classList.remove('active');
      }
    </script>
