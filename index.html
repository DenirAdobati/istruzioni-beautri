<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Beautrì Srl</title>
    <link rel="icon" type="image/png" href="https://beautri.it/wp-content/uploads/2020/02/cropped-favicon_beautri-270x270.png">
    <link rel="apple-touch-icon" href="https://beautri.it/wp-content/uploads/2020/02/cropped-favicon_beautri-270x270.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;800&display=swap" rel="stylesheet">
 
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
 
      html, body {
        height: 100%;
        font-family: 'Outfit', sans-serif;
        background-color: #E8E4DA;
      }
 
      /* ══════════════════════════════
         GRIGLIA
      ══════════════════════════════ */
      #grid-view {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem 1.2rem 5rem;
      }
 
      .product-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1rem;
        width: 100%;
        max-width: 400px;
      }
 
      .product-card {
        display: flex;
        flex-direction: column;
        text-decoration: none;
        border-radius: 24px;
        overflow: hidden;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        background: #FFFFFF;
        border: 1px solid rgba(26,26,26,0.09);
        transition: transform 0.22s cubic-bezier(0.34,1.3,0.64,1), box-shadow 0.22s ease;
      }
 
      .product-card:hover {
        transform: translateY(-5px) scale(1.025);
        box-shadow: 0 20px 50px rgba(26,26,26,0.22);
      }
 
      .product-card:active { transform: scale(0.97); box-shadow: none; }
 
      .card-img-wrap {
        width: 100%;
        aspect-ratio: 3 / 4;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 3% 5% 2%;
        background: #FFFFFF;
      }
 
      .card-img-wrap img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
        transition: transform 0.35s ease;
        filter: drop-shadow(0 8px 20px rgba(0,0,0,0.15));
      }
 
      .product-card:hover .card-img-wrap img {
        transform: scale(1.07) translateY(-5px);
      }
 
      .card-divider {
        height: 1px;
        background: linear-gradient(90deg, transparent, #C9A227 30%, #C9A227 70%, transparent);
        margin: 0 1rem;
        opacity: 0.6;
      }
 
      .card-name {
        padding: 0.65rem 1rem 0.85rem;
        display: flex;
        align-items: center;
        gap: 0.55rem;
        background: #FFFFFF;
      }
 
      .card-name-dot {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: #C9A227;
        flex-shrink: 0;
      }
 
      .card-name-text {
        font-size: 0.78rem;
        font-weight: 800;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #1A1A1A;
        line-height: 1;
      }
 
      @media (max-width: 360px) { .product-grid { gap: 0.75rem; } }
      @media (min-width: 500px) { .product-grid { max-width: 440px; gap: 1.2rem; } }
 
      /* ══════════════════════════════
         VISTA VIDEO — occupa tutto lo schermo
      ══════════════════════════════ */
      #video-view {
        display: none;
        position: fixed;
        inset: 0;
        background: #E8E4DA;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 3.5rem 1rem 1rem;
        z-index: 200;
      }
 
      #video-view.active {
        display: flex;
      }
 
      .back-btn {
        position: absolute;
        top: 1.1rem;
        left: 1.2rem;
        display: flex;
        align-items: center;
        gap: 0.4rem;
        font-size: 0.65rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #1A1A1A;
        opacity: 0.45;
        background: none;
        border: none;
        cursor: pointer;
        padding: 0;
        font-family: 'Outfit', sans-serif;
        transition: opacity 0.2s;
      }
 
      .back-btn:hover { opacity: 1; }
      .back-btn svg { width: 14px; height: 14px; }
 
      /* video: altezza quasi piena schermo, larghezza proporzionale 9:16 */
      .video-wrapper {
        width: 100%;
        /* altezza = viewport - spazio freccia sopra e margine sotto */
        height: calc(100vh - 5rem);
        /* larghezza massima basata sul rapporto 9:16 */
        max-width: calc((100vh - 5rem) * 9 / 16);
        border-radius: 18px;
        overflow: hidden;
        box-shadow: 0 16px 48px rgba(26,26,26,0.2);
        background: #1A1A1A;
      }
 
      .video-wrapper iframe {
        width: 100%;
        height: 100%;
        border: none;
        display: block;
      }
    </style>
  </head>
  <body>
 
    <!-- ── GRIGLIA ── -->
    <div id="grid-view">
      <div class="product-grid">
 
        <div class="product-card" onclick="openVideo('CuMIowDFg5w')">
          <div class="card-img-wrap">
            <img src="https://raw.githubusercontent.com/DenirAdobati/istruzioni-beautri/main/Shampoo.png" alt="Shampoo" loading="eager" />
          </div>
          <div class="card-divider"></div>
          <div class="card-name"><div class="card-name-dot"></div><span class="card-name-text">Shampoo</span></div>
        </div>
 
        <div class="product-card" onclick="openVideo('1b4h6CX64eY')">
          <div class="card-img-wrap">
            <img src="https://raw.githubusercontent.com/DenirAdobati/istruzioni-beautri/main/Lozione.png" alt="Lozione" loading="eager" />
          </div>
          <div class="card-divider"></div>
          <div class="card-name"><div class="card-name-dot"></div><span class="card-name-text">Lozione</span></div>
        </div>
 
        <div class="product-card" onclick="openVideo('S7pz1fwtHiQ')">
          <div class="card-img-wrap">
            <img src="https://raw.githubusercontent.com/DenirAdobati/istruzioni-beautri/main/Conditioner.png" alt="Conditioner" loading="eager" />
          </div>
          <div class="card-divider"></div>
          <div class="card-name"><div class="card-name-dot"></div><span class="card-name-text">Conditioner</span></div>
        </div>
 
        <div class="product-card" onclick="openVideo('Fs5UVQApcn4')">
          <div class="card-img-wrap">
            <img src="https://raw.githubusercontent.com/DenirAdobati/istruzioni-beautri/main/Emulsione%20LENITIVA.png" alt="Emulsione Lenitiva" loading="eager" />
          </div>
          <div class="card-divider"></div>
          <div class="card-name"><div class="card-name-dot"></div><span class="card-name-text">Emulsione Lenitiva</span></div>
        </div>
 
        <div class="product-card" onclick="openVideo('O8fJ_afMtsg')">
          <div class="card-img-wrap">
            <img src="https://raw.githubusercontent.com/DenirAdobati/istruzioni-beautri/main/Emulsione%20AVVOLGENTE.png" alt="Emulsione Avvolgente" loading="eager" />
          </div>
          <div class="card-divider"></div>
          <div class="card-name"><div class="card-name-dot"></div><span class="card-name-text">Emulsione Avvolgente</span></div>
        </div>
 
        <div class="product-card" onclick="openVideo('CpbqIZhjxu0')">
          <div class="card-img-wrap">
            <img src="https://raw.githubusercontent.com/DenirAdobati/istruzioni-beautri/main/Maschera.png" alt="Maschera" loading="eager" />
          </div>
          <div class="card-divider"></div>
          <div class="card-name"><div class="card-name-dot"></div><span class="card-name-text">Maschera</span></div>
        </div>
 
      </div>
    </div>
 
    <!-- ── VISTA VIDEO (overlay fullscreen) ── -->
    <div id="video-view">
      <button class="back-btn" onclick="closeVideo()">
        <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9,2 4,7 9,12"/>
        </svg>
        Prodotti
      </button>
      <div class="video-wrapper">
        <iframe id="video-iframe" src="" title="Beautrì"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          allowfullscreen>
        </iframe>
      </div>
    </div>
 
    <script>
      function openVideo(ytid) {
        document.getElementById('video-iframe').src =
          'https://www.youtube.com/embed/' + ytid + '?autoplay=1&rel=0&modestbranding=1&playsinline=1';
        document.getElementById('video-view').classList.add('active');
      }
 
      function closeVideo() {
        document.getElementById('video-iframe').src = '';
        document.getElementById('video-view').classList.remove('active');
      }
    </script>
 
  </body>
</html>
 
 
<!-- WHATSAPP WIDGET -->
<style>
  .wa-float {
    position: fixed;
    bottom: 1.4rem;
    right: 1.2rem;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 0.6rem;
  }
  .wa-bubble {
    background: #1A1A1A;
    color: #FFFFFF;
    font-family: 'Outfit', sans-serif;
    font-size: 0.65rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 0.5rem 0.9rem;
    border-radius: 2rem;
    white-space: nowrap;
    box-shadow: 0 2px 12px rgba(0,0,0,0.25);
    opacity: 0;
    transform: translateY(4px);
    animation: bubble-in 0.4s ease 1s forwards;
  }
  @keyframes bubble-in { to { opacity: 1; transform: translateY(0); } }
  .wa-link {
    display: block;
    width: 58px;
    height: 58px;
    text-decoration: none;
    opacity: 0;
    animation: icon-in 0.45s cubic-bezier(0.34,1.56,0.64,1) 0.5s forwards,
               wa-ring 2.5s ease-in-out 2s infinite;
    border-radius: 50%;
    filter: drop-shadow(0 4px 12px rgba(0,0,0,0.3));
    transition: transform 0.25s cubic-bezier(0.34,1.56,0.64,1);
  }
  @keyframes icon-in {
    from { opacity: 0; transform: scale(0.5); }
    to   { opacity: 1; transform: scale(1); }
  }
  @keyframes wa-ring {
    0%, 100% { filter: drop-shadow(0 4px 12px rgba(0,0,0,0.3)) drop-shadow(0 0 0px rgba(37,211,102,0)); }
    50%       { filter: drop-shadow(0 4px 12px rgba(0,0,0,0.3)) drop-shadow(0 0 10px rgba(37,211,102,0.5)); }
  }
  .wa-link:hover { transform: scale(1.1); }
  .wa-link:active { transform: scale(0.95); }
  .wa-link img { width: 58px; height: 58px; object-fit: contain; display: block; }
</style>

</div>
