<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Beautrì Srl</title>
    <link rel="icon" type="image/png" href="https://beautri.it/wp-content/uploads/2020/02/cropped-favicon_beautri-270x270.png">
    <link rel="apple-touch-icon" href="https://beautri.it/wp-content/uploads/2020/02/cropped-favicon_beautri-270x270.png">
    <!-- Google Fonts: Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
      /* Reset & Base Styles */
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
 
      body {
        font-family: 'Montserrat', sans-serif;
        background-color: #FDFDFD; /* Bianco Seta */
        color: #292524; /* Stone 800 */
        height: 100vh;
        width: 100vw;
        overflow: hidden; /* Prevent scrolling */
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
      }
 
      /* Layout Container */
      .container {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        width: 100%;
        max-width: 28rem; /* Equivalent to max-w-md */
      }
 
      /* Logo Styling */
      .logo-container {
        margin-bottom: 3rem; /* Equivalent to mb-12 */
      }
 
      .logo-img {
        width: 200px;
        height: auto;
        object-fit: contain;
        opacity: 0.9;
        display: block;
      }
 
      @media (min-width: 768px) {
        .logo-container {
          margin-bottom: 4rem; /* Equivalent to md:mb-16 */
        }
        .logo-img {
          width: 250px;
        }
      }
 
      /* Text Styling */
      .welcome-text {
        font-size: 1.125rem; /* Equivalent to text-lg */
        font-weight: 300; /* Equivalent to font-light */
        letter-spacing: 0.15em;
        line-height: 1.625;
        text-transform: uppercase;
        opacity: 0.8;
      }
 
      @media (min-width: 640px) {
        .welcome-text {
          font-size: 1.25rem; /* Equivalent to text-xl */
        }
      }
 
      /* Footer Placeholder */
      .footer-decoration {
        position: absolute;
        bottom: 2rem;
        opacity: 0.2;
      }
    </style>
  </head>
  <body>
 
    <div class="container">
      
      <!-- LOGO SECTION -->
      <div class="logo-container">
        <img 
          src="https://i.ibb.co/9BMV7P6/1000px.png" 
          alt="Beautrì Srl Logo" 
          class="logo-img"
        />
      </div>
 
      <!-- MAIN CONTENT -->
      <p class="welcome-text">
        Grazie per aver acquistato i nostri prodotti.
      </p>
 
      <!-- 
        ========================================
        HIDDEN PLACEHOLDERS FOR FUTURE DEVELOPMENT
        ========================================
      -->
 
      <!-- 
        PLACEHOLDER: BUTTONS SECTION
        Area riservata per l'inserimento dei 3 tasti di navigazione/azione.
        Esempio struttura futura:
        <div style="margin-top: 3rem; display: flex; flex-direction: column; gap: 1rem; width: 100%; max-width: 20rem;">
          <button style="padding: 1rem; border: 1px solid #e5e7eb; background: white; font-family: inherit;">Tasto 1</button>
          <button style="padding: 1rem; border: 1px solid #e5e7eb; background: white; font-family: inherit;">Tasto 2</button>
          <button style="padding: 1rem; border: 1px solid #e5e7eb; background: white; font-family: inherit;">Tasto 3</button>
        </div>
      -->
 
      <!-- 
        PLACEHOLDER: VIDEO SECTION
        Area riservata per l'inserimento dei video di Daniela.
        Esempio struttura futura:
        <div style="margin-top: 2rem; width: 100%; aspect-ratio: 16/9; border-radius: 0.5rem; overflow: hidden; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);">
          <video src="URL_VIDEO" controls style="width: 100%; height: 100%; object-fit: cover;"></video>
        </div>
      -->
 
    </div>
 
    <!-- Footer Decoration (Optional) -->
    <div class="footer-decoration">
      <!-- Potenziale elemento decorativo o footer minimale se necessario in futuro -->
    </div>
 
    <!-- ==============================
         WHATSAPP WIDGET — stile menù
         ============================== -->
    <style>
      .wa-float {
        position: fixed;
        bottom: 1.4rem;
        right: 1.2rem;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 0.6rem;
      }
 
      /* Bubble tooltip */
      .wa-bubble {
        background: #1A1A1A;
        color: #FFFFFF;
        font-family: 'Montserrat', sans-serif;
        font-size: 0.7rem;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        padding: 0.5rem 0.9rem;
        border-radius: 2rem;
        white-space: nowrap;
        box-shadow: 0 2px 12px rgba(0,0,0,0.25);
        opacity: 0;
        transform: translateY(4px);
        animation: bubble-in 0.4s ease 1s forwards;
      }
 
      @keyframes bubble-in {
        to { opacity: 1; transform: translateY(0); }
      }
 
      /* WhatsApp icon button */
      .wa-link {
        display: block;
        width: 64px;
        height: 64px;
        position: relative;
        text-decoration: none;
        opacity: 0;
        animation: icon-in 0.45s cubic-bezier(0.34,1.56,0.64,1) 0.5s forwards;
      }
 
      @keyframes icon-in {
        from { opacity: 0; transform: scale(0.5); }
        to   { opacity: 1; transform: scale(1); }
      }
 
      /* Dark circle background with glow — like the menu */
      .wa-bg {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: radial-gradient(circle at 40% 40%, #2a2a2a, #0d0d0d);
        box-shadow:
          0 4px 20px rgba(0,0,0,0.5),
          0 0 0 0 rgba(37,211,102,0.4);
        animation: wa-ring 2.5s ease-in-out 2s infinite;
      }
 
      @keyframes wa-ring {
        0%, 100% { box-shadow: 0 4px 20px rgba(0,0,0,0.5), 0 0 0 0 rgba(37,211,102,0.35); }
        50%       { box-shadow: 0 4px 20px rgba(0,0,0,0.5), 0 0 0 10px rgba(37,211,102,0); }
      }
 
      /* Official WhatsApp SVG icon — positioned like in the menu (slightly overflowing) */
      .wa-icon {
        position: absolute;
        bottom: -4px;
        right: -4px;
        width: 52px;
        height: 52px;
      }
 
      .wa-link:hover .wa-bg {
        transform: scale(1.08);
        transition: transform 0.25s cubic-bezier(0.34,1.56,0.64,1);
      }
 
      .wa-link:active .wa-bg {
        transform: scale(0.95);
      }
    </style>
 
    <div class="wa-float">
      <div class="wa-bubble">Hai bisogno di aiuto con il tuo prodotto?</div>
      <a
        class="wa-link"
        href="https://wa.me/393313348233"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Contattaci su WhatsApp"
      >
        <div class="wa-bg"></div>
        <!-- Official WhatsApp logo SVG -->
        <svg class="wa-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 175.216 175.552">
          <defs>
            <linearGradient id="wa-grad-b" x1="85.915%" x2="14.085%" y1="14.089%" y2="85.911%">
              <stop offset="0%" stop-color="#25D366"/>
              <stop offset="100%" stop-color="#20B358"/>
            </linearGradient>
          </defs>
          <!-- White drop shadow layer -->
          <path d="M87.6 0C39.3 0 0 39.3 0 87.6c0 15.4 4 30 11.1 42.7L.4 174.2l45.5-10.4C57.9 170.9 72.5 175 87.6 175c48.3 0 87.6-39.3 87.6-87.6S135.9 0 87.6 0z" fill="#FFF"/>
          <!-- Green circle -->
          <path d="M87.6 9.7C44.6 9.7 9.7 44.6 9.7 87.6c0 14.5 3.9 28.1 10.6 39.9L9.7 165.5l39.4-9.5c11.5 6.2 24.7 9.8 38.5 9.8 43 0 77.9-34.9 77.9-77.9S130.6 9.7 87.6 9.7z" fill="url(#wa-grad-b)"/>
          <!-- Phone handset path -->
          <path d="M67.6 54.5c-1.8-4-3.7-4.1-5.4-4.2-1.4-.1-3-.1-4.6-.1-1.6 0-4.2.6-6.4 3-2.2 2.4-8.4 8.2-8.4 20s8.6 23.2 9.8 24.8c1.2 1.6 16.8 26.7 41.3 36.4 20.5 8 24.6 6.4 29 6c4.4-.4 14.2-5.8 16.2-11.4 2-5.6 2-10.4 1.4-11.4-.6-1-2.2-1.6-4.6-2.8-2.4-1.2-14.2-7-16.4-7.8-2.2-.8-3.8-1.2-5.4 1.2-1.6 2.4-6.2 7.8-7.6 9.4-1.4 1.6-2.8 1.8-5.2.6-2.4-1.2-10.2-3.8-19.4-12-7.2-6.4-12-14.2-13.4-16.6-1.4-2.4-.2-3.8 1-5 1.2-1.2 2.4-2.8 3.6-4.2 1.2-1.4 1.6-2.4 2.4-4 .8-1.6.4-3-.2-4.2-.6-1.2-5.2-13-7.2-17.7z" fill="#FFF"/>
        </svg>
      </a>
    </div>
 
  </body>
</html>
