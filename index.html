<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Beautrì Srl</title>
    <link rel="icon" type="image/png" href="https://beautri.it/wp-content/uploads/2020/02/cropped-favicon_beautri-270x270.png">
    <link rel="apple-touch-icon" href="https://beautri.it/wp-content/uploads/2020/02/cropped-favicon_beautri-270x270.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800&display=swap" rel="stylesheet">
 
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
 
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #E8E4DA;
        font-family: 'Outfit', sans-serif;
      }
 
      /* ══════════════════════════
         CAROUSEL VIEW
      ══════════════════════════ */
      #carousel-view {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
 
      /* Track scorrevole */
      .carousel-track {
        display: flex;
        align-items: center;
        width: 100%;
        height: 100%;
        overflow-x: scroll;
        overflow-y: hidden;
        scroll-snap-type: x mandatory;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
      }
      .carousel-track::-webkit-scrollbar { display: none; }
 
      /* Slide */
      .slide {
        flex: 0 0 100vw;
        width: 100vw;
        height: 100%;
        scroll-snap-align: center;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        position: relative;
      }
 
      /* Bottiglia: grande, centrata, trasparente */
      .slide img {
        width: 72vw;
        max-width: 340px;
        max-height: 80vh;
        object-fit: contain;
        user-select: none;
        pointer-events: none;
        transition: transform 0.2s ease;
        filter: drop-shadow(0 20px 40px rgba(0,0,0,0.18));
      }
 
      .slide:active img {
        transform: scale(0.96);
      }
 
      /* Dots in basso */
      .dots {
        position: fixed;
        bottom: 2rem;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 7px;
        z-index: 10;
      }
 
      .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: rgba(26,26,26,0.2);
        transition: background 0.3s, transform 0.3s;
      }
 
      .dot.active {
        background: #1A1A1A;
        transform: scale(1.3);
      }
 
      /* Hint swipe — appare solo al primo caricamento */
      .swipe-hint {
        position: fixed;
        bottom: 4rem;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 0.4rem;
        font-size: 0.6rem;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: rgba(26,26,26,0.35);
        animation: hint-fade 0.5s ease 2.5s forwards;
        opacity: 1;
        z-index: 10;
      }
 
      @keyframes hint-fade {
        to { opacity: 0; pointer-events: none; }
      }
 
      .swipe-hint svg {
        width: 18px;
        height: 18px;
        animation: swipe-arrow 1.2s ease-in-out 2s 3;
      }
 
      @keyframes swipe-arrow {
        0%   { transform: translateX(0); opacity: 0.4; }
        50%  { transform: translateX(8px); opacity: 1; }
        100% { transform: translateX(0); opacity: 0.4; }
      }
 
      /* ══════════════════════════
         VIDEO VIEW (fullscreen overlay)
      ══════════════════════════ */
      #video-view {
        display: none;
        position: fixed;
        inset: 0;
        background: #E8E4DA;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 3.5rem 1rem 1rem;
        z-index: 200;
      }
 
      #video-view.active { display: flex; }
 
      .back-btn {
        position: absolute;
        top: 1.1rem;
        left: 1.2rem;
        display: flex;
        align-items: center;
        gap: 0.4rem;
        font-size: 0.65rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #1A1A1A;
        opacity: 0.45;
        background: none;
        border: none;
        cursor: pointer;
        padding: 0;
        font-family: 'Outfit', sans-serif;
        transition: opacity 0.2s;
      }
      .back-btn:hover { opacity: 1; }
      .back-btn svg { width: 14px; height: 14px; }
 
      .video-wrapper {
        width: 100%;
        height: calc(100vh - 5rem);
        max-width: calc((100vh - 5rem) * 9 / 16);
        border-radius: 18px;
        overflow: hidden;
        box-shadow: 0 16px 48px rgba(26,26,26,0.2);
        background: #1A1A1A;
      }
 
      .video-wrapper iframe {
        width: 100%;
        height: 100%;
        border: none;
        display: block;
      }
 
      /* ══════════════════════════
         WHATSAPP WIDGET
      ══════════════════════════ */
      .wa-float {
        position: fixed;
        bottom: 1.4rem;
        right: 1.2rem;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: flex-end;
      }
 
      .wa-pill {
        display: flex;
        align-items: center;
        background: #1A1A1A;
        border-radius: 50px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        text-decoration: none;
        overflow: hidden;
        opacity: 0;
        transform: scale(0.7) translateY(10px);
        animation: wa-appear 0.5s cubic-bezier(0.34,1.4,0.64,1) 5s forwards;
      }
 
      @keyframes wa-appear {
        to { opacity: 1; transform: scale(1) translateY(0); }
      }
 
      .wa-text {
        font-family: 'Outfit', sans-serif;
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        color: #FFFFFF;
        white-space: nowrap;
        padding: 0 1.1rem 0 1.3rem;
        max-width: 220px;
        overflow: hidden;
        opacity: 0;
        animation:
          text-in  0.4s ease 5.5s forwards,
          text-out 0.4s ease 9s   forwards;
      }
 
      @keyframes text-in  { to { opacity: 1; } }
      @keyframes text-out { to { opacity: 0; max-width: 0; padding: 0; } }
 
      .wa-icon {
        width: 58px;
        height: 58px;
        border-radius: 50%;
        background: #25D366;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        transition: transform 0.2s cubic-bezier(0.34,1.56,0.64,1);
        animation: wa-pulse 3s ease-in-out 6s infinite;
      }
 
      @keyframes wa-pulse {
        0%, 100% { box-shadow: 0 0 0 0 rgba(37,211,102,0); }
        50%       { box-shadow: 0 0 0 8px rgba(37,211,102,0.25); }
      }
 
      .wa-pill:hover .wa-icon { transform: scale(1.1); }
      .wa-pill:active .wa-icon { transform: scale(0.93); }
 
      .wa-icon svg { width: 32px; height: 32px; fill: #FFFFFF; }
    </style>
  </head>
  <body>
 
    <!-- ══ CAROUSEL ══ -->
    <div id="carousel-view">
 
      <div class="carousel-track" id="track">
 
        <div class="slide" onclick="openVideo('CuMIowDFg5w')" data-index="0">
          <img src="https://raw.githubusercontent.com/DenirAdobati/istruzioni-beautri/main/Shampoo.png" alt="Shampoo" loading="eager" />
        </div>
 
        <div class="slide" onclick="openVideo('1b4h6CX64eY')" data-index="1">
          <img src="https://raw.githubusercontent.com/DenirAdobati/istruzioni-beautri/main/Lozione.png" alt="Lozione" loading="eager" />
        </div>
 
        <div class="slide" onclick="openVideo('S7pz1fwtHiQ')" data-index="2">
          <img src="https://raw.githubusercontent.com/DenirAdobati/istruzioni-beautri/main/Conditioner.png" alt="Conditioner" loading="eager" />
        </div>
 
        <div class="slide" onclick="openVideo('Fs5UVQApcn4')" data-index="3">
          <img src="https://raw.githubusercontent.com/DenirAdobati/istruzioni-beautri/main/Emulsione%20LENITIVA.png" alt="Emulsione Lenitiva" loading="eager" />
        </div>
 
        <div class="slide" onclick="openVideo('O8fJ_afMtsg')" data-index="4">
          <img src="https://raw.githubusercontent.com/DenirAdobati/istruzioni-beautri/main/Emulsione%20AVVOLGENTE.png" alt="Emulsione Avvolgente" loading="eager" />
        </div>
 
        <div class="slide" onclick="openVideo('CpbqIZhjxu0')" data-index="5">
          <img src="https://raw.githubusercontent.com/DenirAdobati/istruzioni-beautri/main/Maschera.png" alt="Maschera" loading="eager" />
        </div>
 
      </div>
 
      <!-- Dots -->
      <div class="dots" id="dots">
        <div class="dot active"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
 
      <!-- Hint swipe -->
      <div class="swipe-hint">
        Scorri
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9,6 15,12 9,18"/>
        </svg>
      </div>
 
    </div>
 
    <!-- ══ VIDEO ══ -->
    <div id="video-view">
      <button class="back-btn" onclick="closeVideo()">
        <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9,2 4,7 9,12"/>
        </svg>
        Prodotti
      </button>
      <div class="video-wrapper">
        <iframe id="video-iframe" src="" title="Beautrì"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
          allowfullscreen>
        </iframe>
      </div>
    </div>
 
    <!-- ══ WHATSAPP ══ -->
    <div class="wa-float">
      <a class="wa-pill" href="https://wa.me/393313348233" target="_blank" rel="noopener noreferrer" aria-label="Contattaci su WhatsApp">
        <span class="wa-text">Hai bisogno di aiuto?&nbsp;👋</span>
        <div class="wa-icon">
          <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
            <path d="M16 1C7.716 1 1 7.716 1 16c0 2.67.693 5.178 1.906 7.353L1 31l7.865-1.878A14.94 14.94 0 0016 31c8.284 0 15-6.716 15-15S24.284 1 16 1zm0 27.5a12.44 12.44 0 01-6.32-1.716l-.454-.27-4.67 1.116 1.153-4.543-.298-.468A12.46 12.46 0 013.5 16C3.5 9.096 9.096 3.5 16 3.5S28.5 9.096 28.5 16 22.904 28.5 16 28.5zm6.844-9.18c-.375-.187-2.219-1.094-2.563-1.219-.343-.125-.593-.187-.843.188-.25.374-.968 1.218-1.187 1.468-.219.25-.438.282-.813.094-.375-.188-1.582-.583-3.013-1.857-1.113-.993-1.865-2.219-2.083-2.594-.219-.375-.023-.578.164-.765.169-.168.375-.438.563-.656.187-.219.25-.375.375-.625.125-.25.063-.469-.031-.657-.094-.187-.844-2.03-1.157-2.78-.304-.73-.614-.63-.843-.642-.219-.011-.469-.014-.719-.014-.25 0-.656.094-.999.469-.344.375-1.313 1.281-1.313 3.124 0 1.844 1.344 3.625 1.531 3.875.188.25 2.645 4.038 6.407 5.663.895.386 1.594.617 2.138.79.898.285 1.715.245 2.361.149.72-.108 2.219-.907 2.531-1.782.313-.875.313-1.625.22-1.781-.094-.156-.344-.25-.72-.438z"/>
          </svg>
        </div>
      </a>
    </div>
 
    <script>
      // ── Dots aggiornati sullo scroll ──
      const track = document.getElementById('track');
      const dots  = document.querySelectorAll('.dot');
 
      track.addEventListener('scroll', () => {
        const idx = Math.round(track.scrollLeft / window.innerWidth);
        dots.forEach((d, i) => d.classList.toggle('active', i === idx));
      }, { passive: true });
 
      // ── Video ──
      function openVideo(ytid) {
        document.getElementById('video-iframe').src =
          'https://www.youtube.com/embed/' + ytid + '?autoplay=1&rel=0&modestbranding=1&playsinline=1';
        document.getElementById('video-view').classList.add('active');
      }
 
      function closeVideo() {
        document.getElementById('video-iframe').src = '';
        document.getElementById('video-view').classList.remove('active');
      }
    </script>
 
  </body>
</html>
