<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Beautrì Srl</title>
    <link rel="icon" type="image/png" href="https://beautri.it/wp-content/uploads/2020/02/cropped-favicon_beautri-270x270.png">
    <link rel="apple-touch-icon" href="https://beautri.it/wp-content/uploads/2020/02/cropped-favicon_beautri-270x270.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
      :root {
        --bg:           #FFFFFF;
        --bg-card:      #111111;
        --bg-soft:      #F5F5F5;
        --accent:       #F5C200;
        --accent-h:     #E6B800;
        --accent-glow:  rgba(245,194,0,0.35);
        --text:         #0A0A0A;
        --text-2:       #666666;
        --border:       #E5E5E5;
        --border-2:     #2A2A2A;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        color: var(--text);
      }

      /* ══ APP SHELL ══ */
      /* Sfondo pagina: griglia sottile grigio chiaro su bianco, stesso pattern .grid-bg di beautri.it */
      #app {
        position: fixed;
        inset: 0;
        display: flex;
        justify-content: center;
        background-color: #FFFFFF;
        background-image:
          linear-gradient(rgba(0,0,0,0.04) 1px, transparent 1px),
          linear-gradient(90deg, rgba(0,0,0,0.04) 1px, transparent 1px);
        background-size: 40px 40px;
      }

      /* Colonna app centrata orizzontalmente sulla pagina */
      .app-inner {
        width: 100%;
        max-width: 520px;
        height: 100%;
        display: flex;
        flex-direction: column;
      }

      /* ── Header "isola": pill identica a #main-navbar / .nav-inner di beautri.it ──
         Stesse misure esatte del sito: top 16px, margini laterali 34px (calc(100% - 68px)),
         padding 14px 16px, background rgba(10,10,10,.25) + blur 20px, radius 999px,
         logo 28px con gap 8px, testo 800/18px bianco.
         Stesso comportamento di scroll del sito: #main-navbar è fixed e resta in overlay
         mentre .hero scorre sotto (con padding-top di compensazione); qui replichiamo lo
         stesso schema con .header-island-wrap fixed + padding-top su .intro-group/.chat-messages. ── */
      .header-island-wrap {
        position: fixed;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 100%;
        max-width: 520px;
        padding: 16px 34px;
        z-index: 100;
        pointer-events: none;
      }

      .header-island {
        display: flex;
        align-items: center;
        justify-content: flex-start;
        gap: 8px;
        padding: 14px 16px;
        background: rgba(10,10,10,0.25);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255,255,255,0.06);
        border-radius: 999px;
        box-shadow: 0 4px 32px rgba(0,0,0,0.25);
        pointer-events: auto;
      }

      .header-logo-icon {
        height: 28px;
        width: 28px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .header-logo-icon img { width: 100%; height: 100%; object-fit: contain; display: block; }

      .header-logo-text {
        font-weight: 800;
        font-size: 18px;
        color: #FFFFFF;
        flex-shrink: 0;
      }

      /* ── Gruppo centrale: domanda guida + barra di input, raggruppati e centrati
         verticalmente sotto l'header. Dopo il primo messaggio il gruppo si riduce
         alla sola barra di input, che scivola in fondo mentre i messaggi (in ordine
         visivo invertito con .chat-messages) riempiono lo spazio sopra. ── */
      .intro-group {
        flex: 1 1 auto;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 20px;
        /* 104px = altezza dell'header fixed (88px) + gap originale (1rem), così il
           contenuto non nasce coperto dalla pillola, come .hero{padding-top} sul sito */
        padding: 104px 0 1.5rem;
      }

      #app.started .intro-group {
        flex: 0 0 auto;
        justify-content: flex-start;
        gap: 0;
        padding: 0;
        order: 2;
      }

      /* ── Intro: domanda guida, visibile solo prima del primo messaggio ── */
      .intro {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 0 1.6rem;
        gap: 12px;
      }

      .intro-title {
        font-size: clamp(1.55rem, 6.5vw, 2.15rem);
        font-weight: 900;
        letter-spacing: -0.03em;
        line-height: 1.15;
        color: var(--text);
        max-width: 320px;
      }

      .intro-title .accent-word { color: var(--accent); }

      .intro-sub {
        font-size: 0.86rem;
        font-weight: 500;
        color: var(--text-2);
        max-width: 260px;
        line-height: 1.5;
      }

      #app.started .intro { display: none; }

      /* ── Messages ── */
      .chat-messages {
        display: none;
        flex: 1 1 auto;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        /* padding-top (non margin) = i messaggi scorrono davvero sotto l'header fixed,
           passando dietro la pillola invece di fermarsi con uno spazio vuoto sotto */
        padding: 104px 1rem 1.4rem;
        flex-direction: column;
        gap: 10px;
        scroll-behavior: smooth;
      }

      #app.started .chat-messages { display: flex; order: 1; }

      .msg {
        display: flex;
        align-items: flex-end;
        gap: 8px;
        max-width: 100%;
        animation: msg-in 0.28s ease;
      }

      @keyframes msg-in {
        from { opacity: 0; transform: translateY(8px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      .msg.user { justify-content: flex-end; }
      .msg.bot  { justify-content: flex-start; }

      .msg .mini-avatar {
        width: 24px;
        height: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      .msg .mini-avatar img { width: 100%; height: 100%; object-fit: contain; display: block; }

      .bubble {
        max-width: 78%;
        padding: 0.72rem 0.95rem;
        border-radius: 18px;
        font-size: 0.9rem;
        line-height: 1.45;
        font-weight: 500;
        word-wrap: break-word;
      }

      .bubble.bot {
        background: var(--bg-card);
        color: #FFFFFF;
        border-bottom-left-radius: 4px;
      }

      .bubble.user {
        background: var(--accent);
        color: #0A0A0A;
        font-weight: 700;
        border-bottom-right-radius: 4px;
      }

      /* ── Fallback: nessuna categoria riconosciuta → invito a scrivere su WhatsApp ── */
      .bubble.fallback {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      /* Widget WhatsApp: sempre verde, in ogni punto della chat in cui compare */
      .wa-cta {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        align-self: flex-start;
        background: #25D366;
        color: #FFFFFF;
        font-family: 'Inter', sans-serif;
        font-weight: 700;
        font-size: 0.82rem;
        padding: 0.55rem 1rem 0.55rem 0.7rem;
        border-radius: 999px;
        text-decoration: none;
        box-shadow: 0 4px 16px rgba(37,211,102,0.35);
        transition: background 0.15s ease, transform 0.15s ease;
      }
      .wa-cta:hover { background: #1EBE5A; transform: translateY(-1px); }
      .wa-cta:active { transform: scale(0.97); }
      .wa-cta svg { width: 18px; height: 18px; fill: #FFFFFF; flex-shrink: 0; }

      /* ── Conferma "il video ti è stato utile?" con bottoni Sì/No ── */
      .bubble.confirm {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .yn-row {
        display: flex;
        gap: 8px;
      }

      .yn-btn {
        flex: 1;
        padding: 0.55rem 0;
        border-radius: 999px;
        font-family: 'Inter', sans-serif;
        font-weight: 700;
        font-size: 0.85rem;
        transition: transform 0.15s ease, opacity 0.15s ease;
      }

      .yn-btn.yn-yes {
        background: var(--accent);
        color: #0A0A0A;
      }

      .yn-btn.yn-no {
        background: transparent;
        color: #FFFFFF;
        border: 1px solid rgba(255,255,255,0.3);
      }

      .yn-btn:hover { transform: translateY(-1px); }
      .yn-btn:active { transform: scale(0.96); }

      .yn-btn:disabled { opacity: 0.4; cursor: default; transform: none; }
      .yn-btn.yn-selected:disabled { opacity: 1; }

      .bubble.video {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 0.5rem;
        background: var(--bg-card);
        border-bottom-left-radius: 4px;
        max-width: 84%;
        width: 100%;
      }

      .video-caption {
        font-size: 0.82rem;
        font-weight: 500;
        color: #FFFFFF;
        line-height: 1.4;
        padding: 0.2rem 0.35rem 0;
      }

      .video-frame {
        width: 100%;
        aspect-ratio: 16 / 9;
        border-radius: 12px;
        overflow: hidden;
        background: #000000;
      }

      .video-frame iframe {
        width: 100%;
        height: 100%;
        border: none;
        display: block;
      }

      /* ── Typing indicator ── */
      .bubble.typing {
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 0.85rem 1rem;
      }
      .bubble.typing span {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: rgba(255,255,255,0.55);
        animation: typing-bounce 1.1s ease-in-out infinite;
      }
      .bubble.typing span:nth-child(2) { animation-delay: 0.15s; }
      .bubble.typing span:nth-child(3) { animation-delay: 0.3s; }
      @keyframes typing-bounce {
        0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
        30%           { transform: translateY(-4px); opacity: 1; }
      }

      /* ── Input bar ── */
      .chat-input-wrap {
        position: relative;
        flex: 0 0 auto;
        padding: 0.75rem 1rem calc(0.75rem + env(safe-area-inset-bottom));
        border-top: 1px solid transparent;
        background: transparent;
        transition: border-color 0.3s ease;
        z-index: 30;
      }

      #app.started .chat-input-wrap { border-top-color: var(--border); }

      .chat-form {
        display: flex;
        align-items: center;
        gap: 8px;
        background: var(--bg-soft);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 4px 4px 4px 18px;
      }

      .chat-form input {
        flex: 1;
        border: none;
        outline: none;
        background: transparent;
        font-family: 'Inter', sans-serif;
        font-size: 16px;
        font-weight: 500;
        color: var(--text);
        padding: 10px 0;
      }
      .chat-form input::placeholder { color: var(--text-2); }

      .send-btn {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: var(--accent);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        transition: transform 0.15s ease, background 0.15s ease;
      }
      .send-btn:hover { background: var(--accent-h); }
      .send-btn:active { transform: scale(0.92); }
      .send-btn svg { width: 18px; height: 18px; fill: #0A0A0A; margin-left: 2px; }

    </style>
  </head>
  <body>

    <div id="app">
     <div class="app-inner">

      <!-- ══ 1. INTESTAZIONE — widget isola, identico a #main-navbar di beautri.it ══ -->
      <div class="header-island-wrap">
        <header class="header-island">
          <span class="header-logo-icon" aria-hidden="true">
            <img src="Logo.png" alt="" />
          </span>
          <span class="header-logo-text">Beautrì</span>
        </header>
      </div>

      <!-- ══ 2-4. DOMANDA GUIDA + INPUT — raggruppati e centrati verticalmente;
           dopo il primo messaggio la domanda guida sparisce e la barra di input
           scivola in fondo, mentre .chat-messages riempie lo spazio sopra ══ -->
      <div class="intro-group">
        <div class="intro" id="intro">
          <h1 class="intro-title">Ciao, sono Alessia!<br>Come posso aiutarti con i tuoi <span class="accent-word">prodotti</span>?</h1>
          <p class="intro-sub">Scrivi di che cosa hai bisogno.</p>
        </div>

        <div class="chat-input-wrap">
          <form class="chat-form" id="chat-form" autocomplete="off">
            <input type="text" id="chat-input" placeholder="Scrivi di che cosa hai bisogno…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />
            <button type="submit" class="send-btn" aria-label="Invia">
              <svg viewBox="0 0 24 24"><path d="M3 20l18-8L3 4v6l12 2-12 2z"/></svg>
            </button>
          </form>
        </div>
      </div>

      <!-- ══ Conversazione — si riempie sotto la barra di input una volta avviata la chat ══ -->
      <main class="chat-messages" id="chat-messages"></main>

     </div>
    </div>

    <script>
      /* ══ CATEGORIE PRODOTTO (video già esistenti, riutilizzati senza modifiche) ══ */
      const CATEGORIES = [
        { id: 'shampoo',              label: 'Shampoo',                  videoId: 'CuMIowDFg5w', keywords: ['shampoo', 'sh 1', 'sh1', 'sh 2', 'sh2', 'sh 3', 'sh3'] },
        { id: 'maschera',             label: 'Maschera',                 videoId: 'CpbqIZhjxu0', keywords: ['maschera', 'maschere'] },
        { id: 'lozione',              label: 'Lozione',                  videoId: '1b4h6CX64eY', keywords: ['lozione', 'lozioni', 'soft 1', 'soft1', 'soft 2', 'soft2', 'soft 3', 'soft3', 'active 1', 'active1', 'active 2', 'active2', 'active 3', 'active3'] },
        { id: 'emulsione-lenitiva',   label: 'Emulsione Lenitiva',       videoId: 'Fs5UVQApcn4', keywords: ['emulsione lenitiva', 'lenitiva'] },
        { id: 'emulsione-avvolgente', label: 'Emulsione Avvolgente',     videoId: 'O8fJ_afMtsg', keywords: ['emulsione avvolgente', 'avvolgente'] },
        { id: 'conditioner',          label: 'Conditioner / Balsamo',    videoId: 'S7pz1fwtHiQ', keywords: ['conditioner', 'balsamo'] },
      ];

      const appEl         = document.getElementById('app');
      const messagesEl    = document.getElementById('chat-messages');
      const formEl        = document.getElementById('chat-form');
      const inputEl       = document.getElementById('chat-input');

      /* ── Passaggio dalla schermata iniziale alla conversazione ── */
      let started = false;
      function startChat() {
        if (started) return;
        started = true;
        appEl.classList.add('started');
      }

      /* ── Distanza di Levenshtein (numero minimo di modifiche per trasformare a in b) ── */
      function levenshtein(a, b) {
        const m = a.length, n = b.length;
        const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
        for (let i = 0; i <= m; i++) dp[i][0] = i;
        for (let j = 0; j <= n; j++) dp[0][j] = j;
        for (let i = 1; i <= m; i++) {
          for (let j = 1; j <= n; j++) {
            dp[i][j] = a[i - 1] === b[j - 1]
              ? dp[i - 1][j - 1]
              : 1 + Math.min(dp[i - 1][j - 1], dp[i - 1][j], dp[i][j - 1]);
          }
        }
        return dp[m][n];
      }

      /* Soglia di tolleranza errori: 1 carattere su parole brevi, 2 su parole più lunghe */
      function fuzzyThreshold(len) {
        return len <= 5 ? 1 : 2;
      }

      /* ── Matching per categoria: riconosce la keyword più specifica presente nella frase.
         1) match esatto (substring) — priorità massima
         2) se nessun match esatto, tentativo fuzzy parola-per-parola (tolleranza refusi) ── */
      function matchCategory(raw) {
        const t = raw.toLowerCase().trim();
        if (!t) return null;

        let best = null;
        for (const cat of CATEGORIES) {
          for (const kw of cat.keywords) {
            if (t.includes(kw) && (!best || kw.length > best.kwLen)) {
              best = { cat, kwLen: kw.length };
            }
          }
        }
        if (best) return best.cat;

        const words = t.split(/[^a-zà-ù]+/i).filter(w => w.length >= 3);
        let fuzzyBest = null;
        for (const cat of CATEGORIES) {
          for (const kw of cat.keywords) {
            for (const kwWord of kw.split(' ')) {
              if (kwWord.length < 3) continue;
              const threshold = fuzzyThreshold(kwWord.length);
              for (const w of words) {
                const dist = levenshtein(w, kwWord);
                if (dist <= threshold && (!fuzzyBest || dist < fuzzyBest.dist)) {
                  fuzzyBest = { cat, dist };
                }
              }
            }
          }
        }
        return fuzzyBest ? fuzzyBest.cat : null;
      }

      /* ── Bolle di chat ── */
      function scrollToBottom() {
        requestAnimationFrame(() => {
          messagesEl.scrollTop = messagesEl.scrollHeight;
        });
      }

      function appendUserBubble(text) {
        const msg = document.createElement('div');
        msg.className = 'msg user';
        msg.innerHTML = '<div class="bubble user"></div>';
        msg.querySelector('.bubble').textContent = text;
        messagesEl.appendChild(msg);
        scrollToBottom();
      }

      function appendBotText(text) {
        const msg = document.createElement('div');
        msg.className = 'msg bot';
        msg.innerHTML = '<div class="mini-avatar"><img src="Logo.png" alt="" /></div><div class="bubble bot"></div>';
        msg.querySelector('.bubble').textContent = text;
        messagesEl.appendChild(msg);
        scrollToBottom();
      }

      function appendVideoBubble(cat) {
        const msg = document.createElement('div');
        msg.className = 'msg bot';
        msg.innerHTML =
          '<div class="mini-avatar"><img src="Logo.png" alt="" /></div>' +
          '<div class="bubble video">' +
            '<span class="video-caption">Ti invito a guardare questo video dove Daniela spiega come utilizzare correttamente il prodotto che hai menzionato.</span>' +
            '<div class="video-frame">' +
              '<iframe src="https://www.youtube-nocookie.com/embed/' + cat.videoId + '?rel=0&modestbranding=1&playsinline=1" ' +
              'title="' + cat.label + '" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>' +
            '</div>' +
          '</div>';
        messagesEl.appendChild(msg);
        scrollToBottom();
      }

      const WA_ICON_SVG = '<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><path d="M16 1C7.716 1 1 7.716 1 16c0 2.67.693 5.178 1.906 7.353L1 31l7.865-1.878A14.94 14.94 0 0016 31c8.284 0 15-6.716 15-15S24.284 1 16 1zm0 27.5a12.44 12.44 0 01-6.32-1.716l-.454-.27-4.67 1.116 1.153-4.543-.298-.468A12.46 12.46 0 013.5 16C3.5 9.096 9.096 3.5 16 3.5S28.5 9.096 28.5 16 22.904 28.5 16 28.5zm6.844-9.18c-.375-.187-2.219-1.094-2.563-1.219-.343-.125-.593-.187-.843.188-.25.374-.968 1.218-1.187 1.468-.219.25-.438.282-.813.094-.375-.188-1.582-.583-3.013-1.857-1.113-.993-1.865-2.219-2.083-2.594-.219-.375-.023-.578.164-.765.169-.168.375-.438.563-.656.187-.219.25-.375.375-.625.125-.25.063-.469-.031-.657-.094-.187-.844-2.03-1.157-2.78-.304-.73-.614-.63-.843-.642-.219-.011-.469-.014-.719-.014-.25 0-.656.094-.999.469-.344.375-1.313 1.281-1.313 3.124 0 1.844 1.344 3.625 1.531 3.875.188.25 2.645 4.038 6.407 5.663.895.386 1.594.617 2.138.79.898.285 1.715.245 2.361.149.72-.108 2.219-.907 2.531-1.782.313-.875.313-1.625.22-1.781-.094-.156-.344-.25-.72-.438z"/></svg>';

      function appendFallbackBubble() {
        const msg = document.createElement('div');
        msg.className = 'msg bot';
        msg.innerHTML =
          '<div class="mini-avatar"><img src="Logo.png" alt="" /></div>' +
          '<div class="bubble bot fallback">' +
            '<span>Non ho trovato una risposta per questo. Ti invito a scrivermi su WhatsApp, ti aiuterò subito!</span>' +
            '<a class="wa-cta" href="https://wa.me/393313348233" target="_blank" rel="noopener noreferrer" aria-label="Scrivimi su WhatsApp">' +
              WA_ICON_SVG +
              '<span>Scrivi su WhatsApp</span>' +
            '</a>' +
          '</div>';
        messagesEl.appendChild(msg);
        scrollToBottom();
      }

      /* ── Dopo il video: chiede conferma di utilità con bottoni Sì/No ── */
      function appendConfirmBubble() {
        const msg = document.createElement('div');
        msg.className = 'msg bot';
        msg.innerHTML =
          '<div class="mini-avatar"><img src="Logo.png" alt="" /></div>' +
          '<div class="bubble bot confirm">' +
            '<span>Il video ti è stato utile per risolvere il tuo dubbio?</span>' +
            '<div class="yn-row">' +
              '<button type="button" class="yn-btn yn-yes">Sì</button>' +
              '<button type="button" class="yn-btn yn-no">No</button>' +
            '</div>' +
          '</div>';
        messagesEl.appendChild(msg);

        const row = msg.querySelector('.yn-row');
        row.querySelector('.yn-yes').addEventListener('click', () => handleFeedback(true, row));
        row.querySelector('.yn-no').addEventListener('click', () => handleFeedback(false, row));

        scrollToBottom();
      }

      function handleFeedback(isYes, row) {
        row.querySelectorAll('.yn-btn').forEach(b => { b.disabled = true; });
        row.querySelector(isYes ? '.yn-yes' : '.yn-no').classList.add('yn-selected');

        appendUserBubble(isYes ? 'Sì' : 'No');

        showTyping();
        setTimeout(() => {
          removeTyping();
          if (isYes) {
            appendBotText('Sono felice di averti aiutata! Per qualsiasi altra cosa, sono qui.');
          } else {
            appendNoHelpBubble();
          }
        }, 450);
      }

      /* ── Risposta "No": invito a scrivere direttamente a Daniela su WhatsApp ── */
      function appendNoHelpBubble() {
        const msg = document.createElement('div');
        msg.className = 'msg bot';
        msg.innerHTML =
          '<div class="mini-avatar"><img src="Logo.png" alt="" /></div>' +
          '<div class="bubble bot fallback">' +
            '<span>Mi dispiace, ti invito a contattarci direttamente su WhatsApp: ti risponderà Daniela che ti aiuterà subito.</span>' +
            '<a class="wa-cta" href="https://wa.me/393313348233" target="_blank" rel="noopener noreferrer" aria-label="Scrivi a Daniela su WhatsApp">' +
              WA_ICON_SVG +
              '<span>Scrivi su WhatsApp</span>' +
            '</a>' +
          '</div>';
        messagesEl.appendChild(msg);
        scrollToBottom();
      }

      let typingEl = null;
      function showTyping() {
        typingEl = document.createElement('div');
        typingEl.className = 'msg bot';
        typingEl.innerHTML =
          '<div class="mini-avatar"><img src="Logo.png" alt="" /></div>' +
          '<div class="bubble bot typing"><span></span><span></span><span></span></div>';
        messagesEl.appendChild(typingEl);
        scrollToBottom();
      }
      function removeTyping() {
        if (typingEl) { typingEl.remove(); typingEl = null; }
      }

      /* ── Invio messaggio (testo digitato o suggerimento) ── */
      /* Conta i tentativi consecutivi non riconosciuti: 1° → chiarimento, 2° → fallback WhatsApp */
      let consecutiveMisses = 0;

      function submitMessage(rawText) {
        const text = rawText.trim();
        if (!text) return;

        startChat();
        appendUserBubble(text);
        const cat = matchCategory(text);

        showTyping();
        setTimeout(() => {
          removeTyping();

          if (cat) {
            consecutiveMisses = 0;
            appendVideoBubble(cat);
            /* Attesa ~10s (tempo per guardare il video) prima della domanda automatica */
            setTimeout(() => {
              showTyping();
              setTimeout(() => {
                removeTyping();
                appendConfirmBubble();
              }, 600);
            }, 10000);
          } else {
            consecutiveMisses++;
            if (consecutiveMisses === 1) {
              appendBotText('Posso sapere di che tipologia di prodotto stai parlando?');
            } else {
              appendFallbackBubble();
              consecutiveMisses = 0;
            }
          }
        }, 450);
      }

      formEl.addEventListener('submit', (e) => {
        e.preventDefault();
        const text = inputEl.value.trim();
        if (!text) return;
        inputEl.value = '';
        submitMessage(text);
      });
    </script>

  </body>
</html>
